name: Home Assistant integration tests

on:
  push:
  pull_request:

jobs:
  ha-integration:
    name: Home Assistant 2026.11 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install official Home Assistant test fixtures
        run: python -m pip install "pytest-homeassistant==2026.11.1"
      - name: Test against Home Assistant public API
        run: python -m pytest -q tests/ha/test_integration.py
