name: Publish v1.0.0 (manual)

# No push or PR trigger. Requires explicit dispatch on main and confirmation.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_V1_0_0 to authorize publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resource-queue-manager-publish-v1.0.0
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release authorization, branch and files
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Release must be dispatched on main"; exit 1;
          }
          test "$CONFIRMATION" = "PUBLISH_V1_0_0" || {
            echo "::error::Explicit confirmation token required"; exit 1;
          }
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/resource_queue_manager/manifest.json").read_text())
          assert manifest["version"] == "1.0.0", "Manifest is not v1.0.0"
          assert Path("docs/releases/v1.0.0.md").is_file(), "Missing v1.0.0 release notes"
          assert Path("docs/MIGRATION_v0.4_to_v1.md").is_file(), "Missing migration guide"
          PY

  tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run pure Python and release metadata checks
        run: python -m unittest discover -s tests -v
      - name: Install Home Assistant 2026.11 fixtures
        run: python -m pip install "pytest-homeassistant==2026.11.1"
      - name: Run integration tests
        run: python -m pytest -q tests/ha

  hacs:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant manifest
        uses: home-assistant/actions/hassfest@master

  publish:
    needs: [preflight, tests, hacs, hassfest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse duplicate or pre-existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.0.0 already exists; no overwrite permitted"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" >/dev/null 2>&1; then
            echo "::error::Tag v1.0.0 already exists; reconcile manually before publishing"
            exit 1
          fi
      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Resource Queue Manager v1.0.0" \
            --notes-file docs/releases/v1.0.0.md \
            --latest
