name: Publish initial v0.4.0 release

# One-time publication gate. This only runs when this file first lands on
# main (or if the maintainer explicitly dispatches it on main).
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.0.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fifo-and-home-assistant:
    name: Validate FIFO and Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run isolated FIFO tests
        run: python -m unittest discover -s tests -v
      - name: Install Home Assistant test fixtures
        run: python -m pip install "pytest-homeassistant==2026.11.1"
      - name: Run Home Assistant integration tests
        run: python -m pytest -q tests/ha/test_integration.py

  hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS repository validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Validate hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom integration
        uses: home-assistant/actions/hassfest@master

  publish:
    name: Publish first GitHub Release
    needs:
      - fifo-and-home-assistant
      - hacs
      - hassfest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release version matches integration version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(
              Path("custom_components/resource_queue_manager/manifest.json").read_text()
          )["version"]
          assert version == "0.4.0", f"Expected v0.4.0, found {version}"
          assert Path("docs/releases/v0.4.0.md").is_file(), "Release notes missing"
          PY
      - name: Create public GitHub Release v0.4.0 (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 has already been published; no duplicate created."
            exit 0
          fi
          gh release create v0.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Resource Queue Manager (FIFO) v0.4.0" \
            --notes-file docs/releases/v0.4.0.md \
            --latest
